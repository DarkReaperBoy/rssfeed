name: Fetch feeds & publish
on:
  schedule:
    - cron: '0 * * * *'  
  workflow_dispatch:        
  push:
    branches: [main]        
permissions:
  contents: write
concurrency:
  group: fetch-feeds
  cancel-in-progress: false
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check data freshness (schedule runs only)
        if: github.event_name == 'schedule'
        run: |
          set -e
          TS=$(curl -fsSL --max-time 20 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/data/index.json" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const t=JSON.parse(s).generatedAt;console.log(Number(t)||"")}catch{console.log("")}})' || true)
          if [ -n "$TS" ] && [ "$TS" -gt 0 ] 2>/dev/null; then
            AGE=$(( ($(date -u +%s%3N) - TS) / 60000 ))
            echo "Published data age: ${AGE} min"
            if [ "$AGE" -lt 40 ]; then
              echo "Data is fresh (<40 min) — nothing to do."
              echo "SKIP_FETCH=true" >> "$GITHUB_ENV"
            fi
          else
            echo "No published data found (or unreadable) — running a full fetch."
          fi
      - name: Checkout
        if: env.SKIP_FETCH != 'true'
        uses: actions/checkout@v4
      - name: Fetch previous data (retention accumulation)
        if: env.SKIP_FETCH != 'true'
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- data 2>/dev/null || true
          fi
          ls data 2>/dev/null || echo "no previous data (first run)"
      - name: Setup Node
        if: env.SKIP_FETCH != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22 
          cache: npm
      - name: Install deps
        if: env.SKIP_FETCH != 'true'
        run: npm ci
      - name: Fetch feeds
        if: env.SKIP_FETCH != 'true'
        run: npm run fetch
      - name: Assemble site
        if: env.SKIP_FETCH != 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp config.json _site/
          cp -r data _site/
          touch _site/.nojekyll
          ASSET_SHA=$( { sha256sum _site/index.html; find _site/assets -type f -print0 | sort -z | xargs -0 sha256sum; } | sha256sum | cut -c1-10 )
          sed -i -E "s/(\?v=)[^\"]*/\1$ASSET_SHA/g" _site/index.html
      - name: Publish to gh-pages branch
        if: env.SKIP_FETCH != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh feed data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
