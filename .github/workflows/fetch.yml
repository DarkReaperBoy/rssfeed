name: Fetch feeds & publish

# GitHub's scheduler skips cron slots at random — observed 6–9 h gaps and
# multi-hour skip streaks on this repo with plain hourly crons. Every landed
# run here fired 11–55 min LATE (01:11, 01:23, 07:23, 13:40, 22:55): minute 0
# is the most congested minute on GitHub Actions (every cron in the world
# fires there), so this schedule stays OFF it. Four off-peak slots per hour
# + a freshness gate make the refresh self-healing: whichever slot lands
# first after the data goes stale does the fetch, so a skipped slot heals
# within ~15 min instead of stalling for hours. Push/dispatch always run the
# full pipeline so code changes deploy immediately, regardless of data age.
on:
  schedule:
    - cron: '5,20,35,50 * * * *'  # quarter-hourly, offset off the crowded :00; the gate keeps the real cadence at most ~hourly
  workflow_dispatch:        # manual run from the Actions tab
  push:
    branches: [main]        # every push to main deploys via CI/CD

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Scheduled runs first check the age of the published data — fresh data
      # (<45 min) means the previous slot already refreshed, so this run exits
      # in ~20 s without touching any upstream feed. Push/dispatch skip the
      # gate entirely and always deploy.
      - name: Check data freshness (schedule runs only)
        if: github.event_name == 'schedule'
        run: |
          set -e
          TS=$(curl -fsSL --max-time 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/data/index.json" 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const t=JSON.parse(s).generatedAt;console.log(Number(t)||"")}catch{console.log("")}})' || true)
          if [ -n "$TS" ] && [ "$TS" -gt 0 ] 2>/dev/null; then
            AGE=$(( ($(date -u +%s%3N) - TS) / 60000 ))
            echo "Published data age: ${AGE} min"
            if [ "$AGE" -lt 45 ]; then
              echo "Data is fresh (<45 min) — nothing to do."
              echo "SKIP_FETCH=true" >> "$GITHUB_ENV"
            fi
          else
            echo "No published data found (or unreadable) — running a full fetch."
          fi

      - name: Checkout
        if: env.SKIP_FETCH != 'true'
        uses: actions/checkout@v4

      - name: Fetch previous data (for 30-day accumulation)
        if: env.SKIP_FETCH != 'true'
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- data 2>/dev/null || true
          fi
          ls data 2>/dev/null || echo "no previous data (first run)"

      - name: Setup Node
        if: env.SKIP_FETCH != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        if: env.SKIP_FETCH != 'true'
        run: npm ci

      - name: Fetch feeds
        if: env.SKIP_FETCH != 'true'
        run: npm run fetch

      - name: Assemble site
        if: env.SKIP_FETCH != 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp config.json _site/
          cp -r data _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        if: env.SKIP_FETCH != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git commit -m "chore: refresh feed data [skip ci]"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
