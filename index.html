<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Inoreader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='6' cy='18' r='2.5' fill='%23e8710a'/%3E%3Cpath d='M4 10a10 10 0 0 1 10 10h3A13 13 0 0 0 4 7z' fill='%23f5a623'/%3E%3Cpath d='M4 4a16 16 0 0 1 16 16h3A19 19 0 0 0 4 1z' fill='%23e8710a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 1 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></symbol>

  <symbol id="i-newfolder" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M20 6h-8l-2 2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-6 9h-3v3h-2v-3H6v-2h3v-3h2v3h3z"/></symbol>
  <symbol id="i-dock" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 4h18v16H3zm7 1v14H4V5z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6H10.9l-.4 2.6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 2.6h4.2l.4-2.6a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h12v2H3z"/></symbol>
  <symbol id="i-compact" viewBox="0 0 24 24"><path d="M3 4h18v3H3zm0 6.5h18v3H3zM3 17h18v3H3z"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></symbol>
  <symbol id="i-expanded" viewBox="0 0 24 24"><path d="M3 4h18v6H3zm0 8h18v2H3zm0 3h18v2H3zm0 3h18v2H3z"/></symbol>

  <symbol id="i-magazine" viewBox="0 0 24 24"><path d="M3 4h18v10H3zm0 12h8v4H3zm10 0h8v4h-8z"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h9v2H3zm0 5h6v2H3zm14-3.6V19h3.4L16 22.4 12.6 19H16v-5.6z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></symbol>
  <symbol id="i-markread" viewBox="0 0 24 24"><path d="M2 13h4v8H2zm6-6h4v14H8zm6-5h4v19h-4zm6 9h2v10h-2z"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14zM5 5h6v2H7v10h10v-4h2v6H5z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></symbol>
  <symbol id="i-bulk" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 4h16v16H4zm2 2v12h12V6zm2.5 6.5 2.5 2.5 4.5-4.5-1.4-1.4-3.1 3.1-1.1-1.1z"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M2 4.3 3.3 3 21 20.7 19.7 22l-3.1-3.1A11.6 11.6 0 0 1 12 19C6 19 2 12 2 12a17 17 0 0 1 4.2-5.2zM12 17a9.6 9.6 0 0 0 5.3-1.6L6.6 5.7A9.7 9.7 0 0 0 2 12s4 7 10 7zm9-5-2-1.4A11.9 11.9 0 0 0 12 5c-.8 0-1.6.1-2.3.3l-.9-.9A13.6 13.6 0 0 1 12 4c6 0 10 8 10 8a18.5 18.5 0 0 1-1 1.6z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4L13.2 12z"/></symbol>

  <symbol id="i-tag" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M21.4 11.6 12.4 2.6A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7c0 .5.2 1 .6 1.4l9 9a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8zM6.5 8A1.5 1.5 0 1 1 8 6.5 1.5 1.5 0 0 1 6.5 8z"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2l1.9 5.4L19 9.3l-5.1 1.9L12 16.6l-1.9-5.4L5 9.3l5.1-1.9zM19 14l.9 2.6L22 17.5l-2.1.9L19 21l-.9-2.6-2.1-.9 2.1-.9z"/></symbol>
  <symbol id="i-device" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-1 16H8V6h8z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></symbol>

<div id="wraper">
  <div id="side-nav">


    <div id="tree_pane">
      <div id="feeds_nav" class="nav-panel">
        <div class="sidebar-head">
          <h6 class="sidebar-heading">Feeds</h6>
        </div>

        <fieldset id="subscriptions_fieldset">
          <div id="pdinner_today" class="parent_div hidden">
            <button class="tree-item" data-scope="today" title="Today">
              <i class="sys-icon"><svg><use href="#i-today"/></svg></i><span class="label">Today</span>
              <span class="badge" id="badge-today"></span>
            </button>
          </div>
          <div id="parent_all_articles" class="parent_div selected_parent">
            <button class="tree-item" data-scope="all" title="Newsfeed">
              <i class="sys-icon"><svg><use href="#i-all"/></svg></i><span class="label">Newsfeed</span>
              <span class="badge" id="badge-all-items"></span>
            </button>
          </div>
          <div id="tree"></div>
        </fieldset>
      </div>

      <div id="sidebar_resizer" title="Drag to resize"></div>
      <div class="sidebar-foot" id="last-updated" title=""></div>
    </div>
  </div>

  <div id="content-wrapper">
    <header id="header_pane">
      <div class="heading-wrapper">
        <button id="menu-toggle" class="icon-btn" title="Menu"><svg><use href="#i-menu"/></svg></button>
        <div class="heading-title">
          <div class="title-block">
            <div class="title-row">
              <span id="scope-title" class="cursor_pointer">Newsfeed</span>
            </div>
            <div id="scope-count" class="text-count"></div>
          </div>
        </div>
        <div class="heading-controls">
          <div id="header-right-controls">
            <div class="mark-wrap">
              <div class="btn-group-markread">
                <button id="btn-mark-all" class="btn-heading" title="Mark all as read"><svg><use href="#i-read"/></svg></button>
                <button id="btn-mark-all-split" class="btn-heading btn-split" title="Mark as read articles"><svg><use href="#i-chevron"/></svg></button>
              </div>
              <div id="mark-menu" class="dropdown dropdown-mark hidden">
                <div class="mark-label">Mark as read articles</div>
                <button class="dropdown-item" data-older="1">Older than a day</button>
                <button class="dropdown-item" data-older="2">Older than two days</button>
                <button class="dropdown-item" data-older="3">Older than three days</button>
                <button class="dropdown-item" data-older="7">Older than a week</button>
                <button class="dropdown-item" data-older="14">Older than two weeks</button>
                <button class="dropdown-item" data-older="21">Older than three weeks</button>
                <button class="dropdown-item" data-older="28">Older than four weeks</button>
              </div>
            </div>

            <div id="search-wrap">
              <button id="search-open" class="icon-btn" title="Search in current section"><svg><use href="#i-search"/></svg></button>
              <div id="search-box" class="hidden">
                <svg class="search-icon"><use href="#i-search"/></svg>
                <input id="search-input" type="search" placeholder="Search — feed: title: before: unread:true" autocomplete="off" spellcheck="false">
                <button id="search-close" class="icon-btn" title="Close search"><svg><use href="#i-close"/></svg></button>
              </div>
            </div>
          </div>
          <div class="more-wrap">
            <button id="btn-more" class="icon-btn" title="More"><svg><use href="#i-dots"/></svg></button>
            <div id="header-menu" class="dropdown dropdown-more hidden">
              <div class="menu-label">Article list</div>
              <div id="status-items">
                <button class="dropdown-item" data-status="all"><span class="mi-icon"><svg><use href="#i-all"/></svg></span><span class="check"></span>All articles</button>
                <button class="dropdown-item" data-status="unread"><span class="mi-icon"><svg><use href="#i-unread"/></svg></span><span class="check"></span>Unread articles</button>
                <button class="dropdown-item" data-status="today"><span class="mi-icon"><svg><use href="#i-today"/></svg></span><span class="check"></span>Today</button>
                <button class="dropdown-item" data-status="recently-read"><span class="mi-icon"><svg><use href="#i-read"/></svg></span><span class="check"></span>Recently read</button>
              </div>
              <div class="dropdown-line"></div>
              <button class="dropdown-item" id="menu-select-mode"><span class="mi-icon"><svg><use href="#i-bulk"/></svg></span><span class="check"></span>Multiple select</button>
              <button class="dropdown-item" id="btn-show-filtered"><span class="mi-icon"><svg><use href="#i-eye"/></svg></span><span class="check"></span>Show filtered-out articles</button>
              <button class="dropdown-item" id="menu-refresh"><span class="mi-icon"><svg><use href="#i-refresh"/></svg></span><span class="check"></span>Refresh articles</button>
              <div class="menu-label">View</div>
              <div class="menu-pad">
                <div class="layouts" id="layouts">
                  <button class="icon-btn" data-layout="list" title="List view"><svg><use href="#i-list"/></svg></button>
                  <button class="icon-btn" data-layout="expanded" title="Expanded view"><svg><use href="#i-expanded"/></svg></button>
                  <button class="icon-btn" data-layout="column" title="Column view"><svg><use href="#i-column"/></svg></button>
                  <button class="icon-btn" data-layout="cards" title="Card view"><svg><use href="#i-cards"/></svg></button>
                  <button class="icon-btn" data-layout="magazine" title="Magazine view"><svg><use href="#i-magazine"/></svg></button>
                </div>
              </div>
              <div class="menu-label">Date</div>
              <div class="menu-pad">
                <select id="date-range" title="Date filter">
                  <option value="all">Any time</option>
                  <option value="today">Today</option>
                  <option value="3d">Last 3 days</option>
                  <option value="week">This week</option>
                  <option value="month">This month</option>
                </select>
              </div>
              <div class="dropdown-line"></div>
              <div class="menu-label">Sort</div>
              <div id="sort-items">
                <button class="dropdown-item" data-sort="newest"><span class="mi-icon"><svg><use href="#i-sort"/></svg></span><span class="check"></span>Newest first</button>
                <button class="dropdown-item" data-sort="oldest"><span class="mi-icon"><svg><use href="#i-sort"/></svg></span><span class="check"></span>Oldest first</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div id="reader_pane">
      <div id="list_pane">
        <div id="list" aria-live="polite"></div>
        <div id="empty" class="hidden"></div>
      </div>
      <aside id="article_pane">
        <div id="reader-placeholder">Select an article from the list to be displayed here.</div>
        <div id="reader-slot" class="hidden"></div>
      </aside>
      <div id="scroll-nav">
        <button id="scroll-up" class="scroll-btn" title="Previous articles"><svg><use href="#i-chevron-up"/></svg></button>
        <button id="scroll-down" class="scroll-btn" title="Next articles"><svg><use href="#i-chevron-down"/></svg></button>
      </div>
    </div>
    <div id="row-menu" class="dropdown dropdown-row hidden"></div>
  </div>
</div>

<div id="scrim" class="hidden"></div>

<div id="toast" class="hidden"><span id="toast-text"></span><button id="toast-action"></button></div>

<div id="bulk-bar" class="hidden">
  <span class="count" id="bulk-count">0</span>
  <button class="tool-btn" id="bulk-read"><svg><use href="#i-read"/></svg>Mark read</button>
  <button class="tool-btn" id="bulk-unread"><svg><use href="#i-unread"/></svg>Mark unread</button>
  <button class="tool-btn" id="bulk-clear">Clear</button>
</div>

<div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card modal-small">
    <div class="modal-head"><h2 id="confirm-title">Confirm</h2></div>
    <div class="modal-body">
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="confirm-no" class="tool-btn">Cancel</button>
        <button id="confirm-yes" class="tool-btn tool-primary">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
